# config/brokers.yaml
#
# Broker definitions backed by celine.sdk.broker.MqttBroker.
#
# With auth_with_token: true and OIDC configured (CELINE_OIDC_BASE_URL,
# CELINE_OIDC_CLIENT_SECRET), the service token provider is injected — the
# broker authenticates with JWT and refreshes the token before expiry.
#
# Otherwise static username/password from config is used instead.

brokers:
  celine_mqtt:
    enabled: true
    auth_with_token: true
    config:
      host: "${MQTT_HOST:-host.docker.internal}"
      port: "${MQTT_PORT:-1883}"
      use_tls: "${MQTT_USE_TLS:-false}"
      keepalive: 60
      clean_session: true
      token_refresh_margin: 30.0
      # Static credentials (ignored when token_provider is active):
      # username: "${MQTT_USERNAME:-}"
      # password: "${MQTT_PASSWORD:-}"

default_broker: celine_mqtt
